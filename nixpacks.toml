providers = ['node']

[variables]
NIXPACKS_PKG_ENGINE = 'pnpm'
NIXPACKS_INSTALL_CMD = 'pnpm install'
NIXPACKS_BUILD_CMD = 'pnpm build'

[phases.setup]
nixPkgs = ['nodejs_20', 'nodePackages.pnpm']

[phases.install]
dependsOn = ['setup']
cmds = ['pnpm install --frozen-lockfile']

[phases.build]
cmds = ['pnpm build']

[start]
cmd = 'pnpm start'
