# NOTE: This root nixpacks.toml is intentionally minimal.
# Each service is deployed independently via its own apps/*/railway.toml.
# Railway services MUST have their Root Directory set to apps/<service-name>
# in the Railway dashboard under Settings > Source > Root Directory.
#
# Services and their root directories:
#   api    → apps/api
#   worker → apps/worker
#   admin  → apps/admin
#   web    → apps/web

providers = ['node']

[phases.setup]
nixPkgs = ['nodejs_20', 'nodePackages.pnpm']
